name: FIPS Base Image
# Publishes docker.io/<ns>/rawfile-localpv-base:fips-<hash>, the base image the
# application Dockerfile pins. Only runs when the base inputs change, so the
# expensive OpenSSL FIPS provider + grpcio-from-source build stays out of the
# regular image pipeline. The tag is a content hash, so re-runs for unchanged
# inputs are no-ops.
on:
  push:
    branches:
      - develop
      - "release/**"
    paths:
      - Dockerfile.fips-base
      - poetry.lock
      - .ci/build-fips-base.sh
      - .ci/common
      - .github/workflows/fips-base-image.yml
  workflow_dispatch:
    inputs:
      registry:
        required: false
        type: string
        default: docker.io
      namespace:
        required: false
        type: string
        default: openebs

env:
  CI: 1

jobs:
  fips-base-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Extract NIX_PATH"
        id: nixpath
        run: |
          echo "nix_path=nixpkgs=$(jq -r '.nixpkgs.url' nix/sources.json)" >> $GITHUB_OUTPUT
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: "${{ steps.nixpath.outputs.nix_path }}"
          install_options: --no-daemon
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ hashFiles('shell.nix', 'nix/*') }}
          restore-prefixes-first-match: nix-
      - run: nix-build shell.nix
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
      - name: Build and publish
        env:
          CI_TEST: "false"
          CI_IMAGE_NS: ${{ inputs.namespace || 'openebs' }}
          DNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DPASS: ${{ secrets.DOCKERHUB_TOKEN }}
          DREG: ${{ inputs.registry || 'docker.io' }}
        run: nix-shell --run ".ci/build-fips-base.sh build"
