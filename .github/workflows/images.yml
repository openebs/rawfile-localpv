name: Container Images
on:
  push:
    branches:
      - develop
      - "release/**"
  workflow_call:
    inputs:
      registry:
        required: false
        type: string
        default: docker.io
      namespace:
        required: false
        type: string
        default: openebs

env:
  CI: 1

jobs:
  # Pick the runner by whether the base image (grpcio compile) for the current
  # inputs is already published: if so a standard runner is plenty, otherwise
  # use the large CNCF runner so the cold compile does not take hours.
  base-check:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          CI_IMAGE_NS: ${{ inputs.namespace }}
          CI_REGISTRY: ${{ inputs.registry }}
        run: |
          export SCRIPT_DIR=.ci
          source .ci/common
          if base-image-published; then
            echo "Base image ${CI_BASE_IMAGE} is published; using a standard runner."
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          else
            echo "Base image ${CI_BASE_IMAGE} is not published; using a large runner for the grpcio compile."
            echo "runner=cncf-ubuntu-24-96-x86" >> "$GITHUB_OUTPUT"
          fi

  image-publish:
    needs: base-check
    runs-on: ${{ needs.base-check.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0
      - name: "Extract NIX_PATH"
        id: nixpath
        run: |
          echo "nix_path=nixpkgs=$(jq -r '.nixpkgs.url' nix/sources.json)" >> $GITHUB_OUTPUT
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: "${{ steps.nixpath.outputs.nix_path }}"
          install_options: --no-daemon
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        # cache-nix-action hardcodes the GitHub-hosted `runner` user; the CNCF
        # runners run as `ubuntu`, so there it fails.
        if: runner.environment == 'github-hosted'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ hashFiles('shell.nix', 'nix/*') }}
          restore-prefixes-first-match: nix-
      - run: nix-build shell.nix
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
      - name: Publish base image
        env:
          CI_TEST: "false"
          CI_IMAGE_NS: ${{ inputs.namespace }}
          DNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DPASS: ${{ secrets.DOCKERHUB_TOKEN }}
          DREG: ${{ inputs.registry }}
        run: nix-shell --run ".ci/build-base.sh"
      - name: Build
        env:
          CI_TEST: "false"
          CI_IMAGE_NS: ${{ inputs.namespace }}
          DNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DPASS: ${{ secrets.DOCKERHUB_TOKEN }}
          DREG: ${{ inputs.registry }}
        run: nix-shell --run ".ci/build.sh"
